<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>STL Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; font: 13px/1.4 system-ui, sans-serif; color: #ddd; }
  #menubar {
    position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: rgba(10,10,10,.85); padding: 0 12px; font-size: 13px; color: #ddd;
  }
  #menubar .logo { width: 20px; height: 20px; flex: none; }
  #menubar .brand { font-size: 14px; letter-spacing: .3px; }
  #menubar .brand b { color: #8af; font-weight: 400; }
  .menu { position: relative; }
  .menu > span { padding: 5px 9px; cursor: default; border-radius: 4px; display: block; background: rgba(255,255,255,.07); user-select: none; }
  .menu:hover > span { background: rgba(255,255,255,.14); }
  .menu-items {
    display: none; position: absolute; top: 100%; left: 0; min-width: 140px;
    background: rgba(15,15,15,.97); border: 1px solid #444; border-radius: 4px;
    padding: 4px 0; box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .menu.open .menu-items { display: block; }
  .menu.open > span { background: rgba(255,255,255,.14); }
  .menu-items a { display: block; padding: 6px 14px; color: #ddd; text-decoration: none; font-size: 12px; }
  .menu-items a:hover { background: #36a; color: #fff; }
  #menubar .mname {
    background: rgba(255,255,255,.08); border: 1px solid #555; color: #eee;
    font: inherit; padding: 1px 6px; width: 160px; border-radius: 3px;
  }
  #info {
    position: fixed; top: 46px; left: 10px; background: rgba(0,0,0,.65);
    padding: 10px 14px; border-radius: 6px; white-space: pre; pointer-events: none;
  }
  #side {
    position: fixed; top: 46px; right: 10px; width: 150px; max-height: 80vh; overflow-y: auto;
    background: rgba(0,0,0,.75); border-radius: 6px; padding: 10px 12px; font-size: 12px;
  }
  #side h2 { font-size: 13px; margin: 0 0 6px; }
  #side h3 { font-size: 11px; margin: 10px 0 3px; color: #aaa; text-transform: uppercase; }
  .sel { display: flex; justify-content: space-between; gap: 6px; padding: 1px 0; cursor: pointer; }
  .sel:hover { color: #ffcc66; }
  .sel .m { color: #999; font-family: Consolas, monospace; }
  #dl { pointer-events: auto; }
  #hint { position: fixed; bottom: 10px; left: 10px; color: #888; pointer-events: none; }
  #home {
    position: fixed; bottom: 38px; left: 10px; width: 34px; height: 34px;
    cursor: pointer; opacity: .75; user-select: none;
  }
  #home:hover { opacity: 1; }
  #home svg { display: block; width: 100%; height: 100%; }
  #info .pickall { cursor: pointer; color: #8af; pointer-events: auto; border-radius: 3px; padding: 0 3px; }
  #info .pickall:hover { color: #cff; background: rgba(120,180,255,.25); }
  #info .mname {
    background: rgba(255,255,255,.08); border: 1px solid #555; color: #eee;
    font: inherit; padding: 0 4px; width: 130px; border-radius: 3px;
    pointer-events: auto;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="menubar">
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#8af" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 12 21 7M12 12v10M12 12 3 7"/></svg>
  <span class="brand"><b>3D</b>Viewer</span>
  <div class="menu">
    <span><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
    <div class="menu-items">
      <a id="imp" href="#">Import STL</a>
      <a id="dl" href="model.stl" download="model.stl">Export STL</a>
      <a id="new" href="#">Neues Modell</a>
      <a id="langBtn" href="#">English</a>
    </div>
  </div>
  <input id="mname" class="mname" value="model">
</div>
<div id="info">lade…</div>
<div id="side">
  <h2>Auswahl</h2>
  <div id="selList"><i style="color:#777">nichts ausgewählt</i></div>
</div>
<div id="hint">Klick: auswählen · Strg+Klick: hinzufügen · Ziehen: drehen · Rad: zoomen · Rechtsklick: verschieben · Esc: leeren</div>
<div id="home" title="Ansicht zurücksetzen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.4" fill="#fff" stroke="none"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

// ---------- i18n ----------
const I18N = {
  de: {
    importStl: 'Import STL', exportStl: 'Export STL', newModel: 'Neues Modell',
    otherLang: 'English',
    selection: 'Auswahl', nothingSelected: 'nichts ausgewählt',
    dims: 'Maße', points: 'Punkte', edges: 'Kanten', faces: 'Flächen',
    loading: 'lade…', saved: 'Gespeichert ✓', cancelled: 'Abgebrochen',
    error: 'Fehler: ', resetView: 'Ansicht zurücksetzen',
    hint: 'Klick: auswählen · Strg+Klick: hinzufügen · Ziehen: drehen · Rad: zoomen · Rechtsklick: verschieben · Esc: leeren',
  },
  en: {
    importStl: 'Import STL', exportStl: 'Export STL', newModel: 'New model',
    otherLang: 'Deutsch',
    selection: 'Selection', nothingSelected: 'nothing selected',
    dims: 'Dimensions', points: 'Vertices', edges: 'Edges', faces: 'Faces',
    loading: 'loading…', saved: 'Saved ✓', cancelled: 'Cancelled',
    error: 'Error: ', resetView: 'Reset view',
    hint: 'Click: select · Ctrl+Click: add · Drag: orbit · Wheel: zoom · Right-click: pan · Esc: clear',
  },
};
let lang = localStorage.getItem('lang') || 'de';
const tr = k => I18N[lang][k];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e1e);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.1));
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(60, 80, 40);
scene.add(dir);

const info = document.getElementById('info');
const selList = document.getElementById('selList');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let mesh = null;
const gridObj = new THREE.GridHelper(400, 40, 0x555555, 0x333333);
scene.add(gridObj); // permanent ground grid, only repositioned per model
let importedBuf = null; // imported STL bytes (export uses this when set)
let modelSize = 50;         // latest model extent, for view framing

const fmt = n => (+n).toFixed(2);
const fmtV = v => `(${fmt(v[0])}, ${fmt(v[1])}, ${fmt(v[2])})`;

// ---------- topology ----------
let verts = [];            // [x,y,z] per vertex id
let triVerts = null;       // vid per triangle corner (3 per tri)
let edges = [];            // {a, b} per edge id
let edgeByKey = new Map(); // "a_b" -> edge id
let triFaces = [];         // face id per triangle
let faces = [];            // {area, normal, centroid}
let chains = [];           // selectable edge chains {edges, length, closed, ends}
let edgeChain = null;      // edge id -> chain id
let pointVerts = [];       // vertex ids that are real feature points (chain ends/junctions)
let pointSet = new Set();
let triCount = 0;
let modelDiag = 100;

function buildTopology(geometry) {
  const p = geometry.attributes.position;
  triCount = p.count / 3;

  // weld coincident vertices (1 µm tolerance)
  const weld = new Map();
  const vidOf = new Int32Array(p.count);
  verts = [];
  for (let i = 0; i < p.count; i++) {
    const k = `${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
    let v = weld.get(k);
    if (v === undefined) {
      v = verts.length / 3;
      weld.set(k, v);
      verts.push(p.getX(i), p.getY(i), p.getZ(i));
    }
    vidOf[i] = v;
  }
  triVerts = vidOf;

  // edges
  edgeByKey = new Map();
  const edgeTris = new Map(); // edgeKey -> [triIdx]
  edges = [];
  for (let t = 0; t < triCount; t++) {
    const c = [vidOf[t * 3], vidOf[t * 3 + 1], vidOf[t * 3 + 2]];
    for (let e = 0; e < 3; e++) {
      const a = c[e], b = c[(e + 1) % 3];
      const key = a < b ? `${a}_${b}` : `${b}_${a}`;
      if (!edgeByKey.has(key)) {
        edgeByKey.set(key, edges.length);
        edges.push({ a: Math.min(a, b), b: Math.max(a, b) });
      }
      const et = edgeTris.get(key) || [];
      et.push(t);
      edgeTris.set(key, et);
    }
  }

  // per-triangle normal / plane offset
  const tn = new Float64Array(triCount * 4); // nx,ny,nz,d
  const triArea = new Float64Array(triCount);
  const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
  for (let t = 0; t < triCount; t++) {
    const i3 = t * 3;
    va.fromBufferAttribute(p, i3); vb.fromBufferAttribute(p, i3 + 1); vc.fromBufferAttribute(p, i3 + 2);
    const n = vb.clone().sub(va).cross(vc.clone().sub(va));
    const area = n.length() / 2;
    triArea[t] = area;
    if (area > 0) n.divideScalar(area * 2); // unit normal
    tn[t * 4] = n.x; tn[t * 4 + 1] = n.y; tn[t * 4 + 2] = n.z; tn[t * 4 + 3] = n.dot(va);
  }

  // union-find over triangles sharing an edge with a similar normal —
  // merges coplanar triangles AND smooth surfaces (e.g. cylinder walls)
  // into single selectable faces
  const parent = [...Array(triCount).keys()];
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  const COS_SMOOTH = 0.94; // ~20 degrees

  for (const [key, tris] of edgeTris) {
    if (tris.length === 2) {
      const a = tris[0] * 4, b = tris[1] * 4;
      const dot = tn[a]*tn[b] + tn[a+1]*tn[b+1] + tn[a+2]*tn[b+2];
      if (dot > COS_SMOOTH) parent[find(tris[0])] = find(tris[1]);
    }
  }

  const compTris = new Map();
  for (let t = 0; t < triCount; t++) {
    const r = find(t);
    const arr = compTris.get(r) || [];
    arr.push(t);
    compTris.set(r, arr);
  }

  faces = [];
  triFaces = new Int32Array(triCount);
  let fid = 0;
  for (const tris of compTris.values()) {
    let area = 0, cx = 0, cy = 0, cz = 0, nx = 0, ny = 0, nz = 0;
    for (const t of tris) {
      area += triArea[t];
      cx += (p.getX(t*3) + p.getX(t*3+1) + p.getX(t*3+2)) / 3 * triArea[t];
      cy += (p.getY(t*3) + p.getY(t*3+1) + p.getY(t*3+2)) / 3 * triArea[t];
      cz += (p.getZ(t*3) + p.getZ(t*3+1) + p.getZ(t*3+2)) / 3 * triArea[t];
      nx += tn[t*4] * triArea[t]; ny += tn[t*4+1] * triArea[t]; nz += tn[t*4+2] * triArea[t];
    }
    if (area > 0) { cx /= area; cy /= area; cz /= area; nx /= area; ny /= area; nz /= area; }
    const nl = Math.hypot(nx, ny, nz) || 1;
    faces.push({ area, normal: [nx/nl, ny/nl, nz/nl], centroid: [cx, cy, cz] });
    for (const t of tris) triFaces[t] = fid;
    fid++;
  }

  // ---- hard edges + edge chains ----
  // an edge is "hard" when it separates two different faces (or is a boundary
  // edge); edges inside one smooth face are mesh diagonals
  for (const [key, tris] of edgeTris) {
    const eid = edgeByKey.get(key);
    edges[eid].hard = tris.length !== 2 || triFaces[tris[0]] !== triFaces[tris[1]];
  }

  // merge tangent-continuous hard edges into chains (e.g. a hole rim circle
  // becomes ONE selectable edge); sharp corners (~30 deg) break the chain
  const COS_MAX_TURN = Math.cos(THREE.MathUtils.degToRad(30));
  const vedges = new Map(); // vertex id -> [hard edge ids]
  edges.forEach((e, i) => {
    if (!e.hard) return;
    for (const v of [e.a, e.b]) {
      let arr = vedges.get(v);
      if (!arr) vedges.set(v, arr = []);
      arr.push(i);
    }
  });
  function unitDir(eid, from) {
    const e = edges[eid];
    const p = e.a === from ? e.a : e.b, q = e.a === from ? e.b : e.a;
    const dx = verts[q*3]-verts[p*3], dy = verts[q*3+1]-verts[p*3+1], dz = verts[q*3+2]-verts[p*3+2];
    const l = Math.hypot(dx, dy, dz) || 1;
    return [dx/l, dy/l, dz/l];
  }

  chains = [];
  edgeChain = new Int32Array(edges.length).fill(-1);
  const visited = new Uint8Array(edges.length);
  for (let s = 0; s < edges.length; s++) {
    if (!edges[s].hard || visited[s]) continue;
    const members = [s];
    visited[s] = 1;
    edgeChain[s] = chains.length;
    const chainVerts = new Set([edges[s].a, edges[s].b]);
    let closed = false;

    for (const end of [edges[s].a, edges[s].b]) {
      if (closed) break;
      const other = end === edges[s].a ? edges[s].b : edges[s].a;
      let cur = end, inDir = unitDir(s, other);
      while (true) {
        const cands = (vedges.get(cur) || []).filter(e2 => !visited[e2]);
        let best = -1, bestCos = -2;
        for (const e2 of cands) {
          const od = unitDir(e2, cur);
          const cos = od[0]*inDir[0] + od[1]*inDir[1] + od[2]*inDir[2];
          if (cos > bestCos) { bestCos = cos; best = e2; }
        }
        if (best < 0 || bestCos < COS_MAX_TURN) break;
        visited[best] = 1;
        members.push(best);
        edgeChain[best] = chains.length;
        const e = edges[best];
        const nxt = e.a === cur ? e.b : e.a;
        inDir = unitDir(best, cur);
        cur = nxt;
        if (chainVerts.has(cur)) { closed = true; break; }
        chainVerts.add(cur);
      }
    }

    let length = 0;
    const vcount = new Map();
    for (const m of members) {
      const e = edges[m];
      length += Math.hypot(verts[e.b*3]-verts[e.a*3], verts[e.b*3+1]-verts[e.a*3+1], verts[e.b*3+2]-verts[e.a*3+2]);
      for (const v of [e.a, e.b]) vcount.set(v, (vcount.get(v) || 0) + 1);
    }
    const ends = [...vcount].filter(([, c]) => c === 1).map(([v]) => v);
    chains.push({ edges: members, length, closed, ends });
  }

  // selectable points = chain endpoints only (corners, junctions, loose ends);
  // vertices along smooth curves and inside faces are mesh artifacts
  pointSet = new Set();
  for (const ch of chains) for (const v of ch.ends) pointSet.add(v);
  pointVerts = [...pointSet].sort((a, b) => a - b);
}

// ---------- selection ----------
const selection = new Set(); // "v12" | "e34" | "f5"
let hlEdges = null, hlVerts = null, hlFaces = null;
let hovEdges = null, hovVerts = null, hovFaces = null;
let hoverKey = null;
let dragging = false;

function keyOf(type, id) { return type + id; }

function toggleSelection(type, id, additive) {
  const key = keyOf(type, id);
  if (additive) {
    selection.has(key) ? selection.delete(key) : selection.add(key);
  } else if (selection.has(key)) {
    selection.delete(key); // click again on selected item -> deselect it
  } else {
    selection.clear();
    selection.add(key);
  }
  rebuildSelectionHighlights();
  rebuildHoverHighlight();
  renderSelectionList();
}

function clearSelection() {
  selection.clear();
  rebuildSelectionHighlights();
  rebuildHoverHighlight();
  renderSelectionList();
}

function chainLength(id) { return chains[id].length; }

function selectionText() {
  const items = [...selection].map(k => ({ t: k[0], id: +k.slice(1) }));
  const vs = items.filter(i => i.t === 'v').map(i => 'P' + i.id).sort((a,b)=>+a.slice(1)-+b.slice(1));
  const es = items.filter(i => i.t === 'e').map(i => 'E' + i.id).sort((a,b)=>+a.slice(1)-+b.slice(1));
  const fs = items.filter(i => i.t === 'f').map(i => 'F' + i.id).sort((a,b)=>+a.slice(1)-+b.slice(1));
  const lines = [];
  if (vs.length) lines.push(tr('points') + ': ' + vs.join(', '));
  if (es.length) lines.push(tr('edges') + ': ' + es.join(', '));
  if (fs.length) lines.push(tr('faces') + ': ' + fs.join(', '));
  return lines.join('\n');
}

function renderSelectionList() {
  if (!selection.size) {
    selList.innerHTML = `<i style="color:#777">${tr('nothingSelected')}</i>`;
    return;
  }
  const items = [...selection].map(k => ({ t: k[0], id: +k.slice(1) }));
  const mk = (t, label, meas) => {
    const div = document.createElement('div');
    div.className = 'sel';
    div.innerHTML = `<span>${t}${label}</span><span class="m">${meas}</span>`;
    div.onclick = () => { selection.delete(keyOf(t, label)); rebuildSelectionHighlights(); rebuildHoverHighlight(); renderSelectionList(); };
    return div;
  };
  selList.innerHTML = '';
  for (const i of items.sort((x,y)=>x.t.localeCompare(y.t)||x.id-y.id)) {
    if (i.t === 'v') {
      const k = i.id*3;
      selList.appendChild(mk('P', i.id, fmtV([verts[k],verts[k+1],verts[k+2]])));
    } else if (i.t === 'e') {
      selList.appendChild(mk('E', i.id, fmt(chains[i.id].length) + ' mm' + (chains[i.id].closed ? ' ∞' : '')));
    } else {
      const f = faces[i.id];
      selList.appendChild(mk('F', i.id, fmt(f.area) + ' mm²'));
    }
  }
  copySelection();
}

function copySelection() {
  const text = selectionText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  } else {
    legacyCopy(text);
  }
}

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch {}
  ta.remove();
}

function collectPositions(keys) {
  const ePos = [], vPos = [], fPos = [];
  for (const key of keys) {
    const t = key[0], id = +key.slice(1);
    if (t === 'v') {
      const i = id * 3;
      vPos.push(verts[i], verts[i+1], verts[i+2]);
    } else if (t === 'e') {
      for (const m of chains[id].edges) {
        const e = edges[m];
        ePos.push(verts[e.a*3], verts[e.a*3+1], verts[e.a*3+2], verts[e.b*3], verts[e.b*3+1], verts[e.b*3+2]);
      }
    } else {
      const p = mesh.geometry.attributes.position;
      for (let t2 = 0; t2 < triCount; t2++) {
        if (triFaces[t2] !== id) continue;
        for (let c = 0; c < 3; c++) {
          const vi = t2*3+c;
          fPos.push(p.getX(vi), p.getY(vi), p.getZ(vi));
        }
      }
    }
  }
  return { ePos, vPos, fPos };
}

function rebuildSelectionHighlights() {
  for (const o of [hlEdges, hlVerts, hlFaces]) if (o) { scene.remove(o); o.geometry.dispose(); }
  hlEdges = hlVerts = hlFaces = null;
  const pos = collectPositions(selection);
  const bright = { e: 0xffdd00, v: 0xffff00, f: 0xff9933 };
  if (pos.ePos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos.ePos, 3));
    hlEdges = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: bright.e, depthTest: false }));
    hlEdges.renderOrder = 10;
    scene.add(hlEdges);
  }
  if (pos.vPos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos.vPos, 3));
    hlVerts = new THREE.Points(g, new THREE.PointsMaterial({ color: bright.v, size: 16, sizeAttenuation: false, depthTest: false }));
    hlVerts.renderOrder = 10;
    scene.add(hlVerts);
  }
  if (pos.fPos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos.fPos, 3));
    hlFaces = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: bright.f, transparent: true, opacity: 0.4, side: THREE.DoubleSide,
      depthWrite: false, depthTest: false
    }));
    hlFaces.renderOrder = 10;
    scene.add(hlFaces);
  }
}

function rebuildHoverHighlight() {
  for (const o of [hovEdges, hovVerts, hovFaces]) if (o) { scene.remove(o); o.geometry.dispose(); }
  hovEdges = hovVerts = hovFaces = null;
  if (!hoverKey || selection.has(hoverKey)) return;
  const pos = collectPositions(new Set([hoverKey]));
  const dim = { e: 0x88aaff, v: 0x88aaff, f: 0x88aaff };
  if (pos.ePos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos.ePos, 3));
    hovEdges = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: dim.e, depthTest: false }));
    hovEdges.renderOrder = 9;
    scene.add(hovEdges);
  }
  if (pos.vPos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos.vPos, 3));
    hovVerts = new THREE.Points(g, new THREE.PointsMaterial({ color: dim.v, size: 10, sizeAttenuation: false, transparent: true, opacity: 0.7, depthTest: false }));
    hovVerts.renderOrder = 9;
    scene.add(hovVerts);
  }
  if (pos.fPos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos.fPos, 3));
    hovFaces = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: dim.f, transparent: true, opacity: 0.15, side: THREE.DoubleSide,
      depthWrite: false, depthTest: false
    }));
    hovFaces.renderOrder = 9;
    scene.add(hovFaces);
  }
}

// ---------- picking ----------
const _va = new THREE.Vector3(), _vb = new THREE.Vector3(), _vc = new THREE.Vector3();
const _tmp = new THREE.Vector3();

function closestOnSegment(p, a, b) {
  _va.set(verts[a*3], verts[a*3+1], verts[a*3+2]);
  _vb.set(verts[b*3], verts[b*3+1], verts[b*3+2]);
  const ab = _vb.clone().sub(_va);
  const t = Math.max(0, Math.min(1, _tmp.copy(p).sub(_va).dot(ab) / ab.lengthSq()));
  return _va.clone().addScaledVector(ab, t);
}

function screenDist(p, clickX, clickY) {
  _tmp.copy(p).project(camera);
  if (_tmp.z > 1) return Infinity;
  const sx = (_tmp.x * 0.5 + 0.5) * innerWidth;
  const sy = (-_tmp.y * 0.5 + 0.5) * innerHeight;
  return Math.hypot(sx - clickX, sy - clickY);
}

const _pv = new THREE.Vector3();
function projectTo(x, y, z, out) {
  _pv.set(x, y, z).project(camera);
  out.x = (_pv.x * 0.5 + 0.5) * innerWidth;
  out.y = (-_pv.y * 0.5 + 0.5) * innerHeight;
  out.behind = _pv.z > 1 || _pv.z < -1;
  return out;
}
const _pa = { x: 0, y: 0, behind: false }, _pb = { x: 0, y: 0, behind: false };

// 2D distance point -> segment in screen pixels
function segDistPx(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)) : 0;
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

// returns {type:'v'|'e'|'f', id} under the cursor, or null when nothing is hit.
// Local candidates come from the hit triangle; a global screen-space pass over
// all edges/vertices additionally catches features at the silhouette, where
// the picking ray misses the surface. Global hits are depth-verified against
// the front surface so hidden (back-side) features don't get picked.
function pickAt(clientX, clientY, maxSnapPx) {
  if (!mesh) return null;
  pointer.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(mesh, false)[0];

  const faceId = hit ? triFaces[hit.faceIndex] : -1;
  let snapPx = Math.min(maxSnapPx, 12);
  const cands = [];

  if (hit) {
    const ti = hit.faceIndex;
    const cv = [triVerts[ti*3], triVerts[ti*3+1], triVerts[ti*3+2]];

    // screen distance click -> triangle centroid, as scale for the snap radius
    let cx = 0, cy = 0, cz = 0;
    for (const v of cv) { cx += verts[v*3]; cy += verts[v*3+1]; cz += verts[v*3+2]; }
    const dCentroid = screenDist(_tmp.set(cx/3, cy/3, cz/3), clientX, clientY);
    snapPx = Math.min(maxSnapPx, Math.max(3, dCentroid * 0.2));

    for (const v of cv) {
      if (!pointSet.has(v)) continue;
      cands.push({ type: 'v', id: v, d: screenDist(_vc.set(verts[v*3], verts[v*3+1], verts[v*3+2]), clientX, clientY) * 0.5, global: false });
    }
    for (let k = 0; k < 3; k++) {
      const a = cv[k], b = cv[(k + 1) % 3];
      const key = a < b ? `${a}_${b}` : `${b}_${a}`;
      const eid = edgeByKey.get(key);
      if (eid === undefined || !edges[eid].hard) continue;
      const cid = edgeChain[eid];
      if (cid < 0) continue;
      const cp = closestOnSegment(hit.point, Math.min(a,b), Math.max(a,b));
      cands.push({ type: 'e', id: cid, d: screenDist(cp, clientX, clientY), global: false });
    }
  }

  // global screen-space pass over all hard edges and vertices
  let gEdge = null, gVert = null;
  for (let eid = 0; eid < edges.length; eid++) {
    if (!edges[eid].hard) continue;
    const cid = edgeChain[eid];
    if (cid < 0) continue;
    const e = edges[eid], a3 = e.a*3, b3 = e.b*3;
    const A = projectTo(verts[a3], verts[a3+1], verts[a3+2], _pa);
    const B = projectTo(verts[b3], verts[b3+1], verts[b3+2], _pb);
    if (A.behind || B.behind) continue;
    const d = segDistPx(clientX, clientY, A.x, A.y, B.x, B.y);
    if (!gEdge || d < gEdge.d) gEdge = { type: 'e', id: cid, d, eid, global: true };
  }
  for (const vid of pointVerts) {
    const i = vid * 3;
    const P = projectTo(verts[i], verts[i+1], verts[i+2], _pa);
    if (P.behind) continue;
    const d = Math.hypot(clientX - P.x, clientY - P.y) * 0.5;
    if (!gVert || d < gVert.d) gVert = { type: 'v', id: vid, d, global: true };
  }
  if (gEdge) cands.push(gEdge);
  if (gVert) cands.push(gVert);

  cands.sort((x, y) => x.d - y.d);
  const best = cands[0];
  if (!best || best.d >= snapPx) return faceId >= 0 ? { type: 'f', id: faceId } : null;

  // depth-verify global hits: reject features far behind the front surface
  if (best.global && hit) {
    const tol = Math.max(0.3, modelDiag * 0.008);
    let wdist;
    if (best.type === 'e') {
      const e = edges[best.eid];
      wdist = closestOnSegment(hit.point, e.a, e.b).distanceTo(hit.point);
    } else {
      const i = best.id * 3;
      wdist = _tmp.set(verts[i], verts[i+1], verts[i+2]).distanceTo(hit.point);
    }
    if (wdist > tol) return { type: 'f', id: faceId };
  }
  return { type: best.type, id: best.id };
}

let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });

controls.addEventListener('start', () => { dragging = true; });
controls.addEventListener('end', () => {
  dragging = false;
  localStorage.setItem('camState', JSON.stringify({
    p: camera.position.toArray(), t: controls.target.toArray()
  }));
});

// auto-reload when model.stl changes on disk (camera is restored from camState)
let lastMtime = null;
setInterval(async () => {
  try {
    const r = await fetch('model.stl', { method: 'HEAD' });
    const lm = r.headers.get('Last-Modified');
    if (lastMtime === null) { lastMtime = lm; return; }
    if (lm && lm !== lastMtime) {
      localStorage.removeItem('emptyModel');
      location.reload();
    }
  } catch {}
}, 3000);

renderer.domElement.addEventListener('pointermove', e => {
  if (!mesh || dragging) return;
  const pick = pickAt(e.clientX, e.clientY, 20);
  const key = pick ? keyOf(pick.type, pick.id) : null;
  if (key !== hoverKey) {
    hoverKey = key;
    rebuildHoverHighlight();
    renderer.domElement.style.cursor = pick ? 'pointer' : '';
  }
});

renderer.domElement.addEventListener('click', e => {
  if (!mesh || Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return;
  const additive = e.ctrlKey || e.metaKey;
  const pick = pickAt(e.clientX, e.clientY, 20);
  if (!pick) { if (!additive) clearSelection(); return; }
  toggleSelection(pick.type, pick.id, additive);
});

addEventListener('keydown', e => { if (e.key === 'Escape') clearSelection(); });

info.addEventListener('click', e => {
  const el = e.target.closest('.pickall');
  if (!el) return;
  const t = el.dataset.t;
  const count = t === 'v' ? pointVerts.length : t === 'e' ? chains.length : faces.length;
  selection.clear();
  for (let i = 0; i < count; i++) {
    const id = t === 'v' ? pointVerts[i] : i;
    selection.add(keyOf(t, id));
  }
  rebuildSelectionHighlights();
  rebuildHoverHighlight();
  renderSelectionList();
});

// ---------- load ----------
function applyGeometry(geometry, useSavedCam = true) {
  geometry.computeVertexNormals();
  geometry.rotateX(-Math.PI / 2); // STL is Z-up, Three.js is Y-up
  buildTopology(geometry);
  selection.clear(); hoverKey = null;
  rebuildSelectionHighlights(); rebuildHoverHighlight(); renderSelectionList();

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
    color: 0x88aaff, metalness: 0.1, roughness: 0.6, side: THREE.DoubleSide
  }));
  scene.add(mesh);

  const box = new THREE.Box3().setFromBufferAttribute(geometry.attributes.position);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  if (!isFinite(size.x)) { size.set(0, 0, 0); center.set(0, 0, 0); box.min.setScalar(0); }
  modelDiag = size.length();

  const savedCam = useSavedCam && JSON.parse(localStorage.getItem('camState') || 'null');
  if (savedCam) {
    camera.position.fromArray(savedCam.p);
  } else {
    const e = Math.max(size.x, size.y, size.z, 50);
    camera.position.set(e * 1.2, e * 1.2, e * 1.6);
  }
  controls.target.set(0, 0, 0); // orbit always around the grid center
  camera.near = Math.max(0.1, Math.min(size.x, size.y, size.z) / 100);
  camera.far = Math.max(1000, Math.max(size.x, size.y, size.z) * 100);
  camera.updateProjectionMatrix();
  controls.update();

  gridObj.scale.setScalar(Math.max(1, Math.max(size.x, size.y) / 100));
  gridObj.position.y = (isFinite(box.min.y) ? box.min.y : 0) - 0.01;

  lastSize = size;
  renderInfo();

  modelSize = Math.max(size.x, size.y, size.z, 50);
}

let lastSize = null;
function renderInfo() {
  if (!lastSize) { info.textContent = tr('loading'); return; }
  info.innerHTML =
    `${tr('dims')}: ${fmt(lastSize.x)} × ${fmt(lastSize.y)} × ${fmt(lastSize.z)} mm<br>` +
    `<span class="pickall" data-t="v">${tr('points')}: ${pointVerts.length}</span><br>` +
    `<span class="pickall" data-t="e">${tr('edges')}: ${chains.length}</span><br>` +
    `<span class="pickall" data-t="f">${tr('faces')}: ${faces.length}</span>`;
}

// ---------- menubar ----------
const menuEl = document.querySelector('.menu');
menuEl.querySelector(':scope > span').addEventListener('click', e => {
  e.stopPropagation();
  menuEl.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!menuEl.contains(e.target)) menuEl.classList.remove('open');
});
menuEl.querySelector('.menu-items').addEventListener('click', () => {
  menuEl.classList.remove('open');
});

function applyLang() {
  imp.textContent = tr('importStl');
  dl.textContent = tr('exportStl');
  document.getElementById('new').textContent = tr('newModel');
  document.getElementById('langBtn').textContent = tr('otherLang');
  document.querySelector('#side h2').textContent = tr('selection');
  document.getElementById('hint').textContent = tr('hint');
  document.getElementById('home').title = tr('resetView');
  renderInfo();
  renderSelectionList();
}
document.getElementById('langBtn').addEventListener('click', e => {
  e.preventDefault();
  lang = lang === 'de' ? 'en' : 'de';
  localStorage.setItem('lang', lang);
  applyLang();
});
const mname = document.getElementById('mname');
const dl = document.getElementById('dl');
const imp = document.getElementById('imp');
applyLang();

const saved = localStorage.getItem('modelName');
if (saved) mname.value = saved;
const syncName = () => {
  const n = mname.value.trim().replace(/[<>:"/\\|?*]/g, '') || 'model';
  dl.download = n + '.stl';
  localStorage.setItem('modelName', n);
};
mname.addEventListener('input', syncName);
syncName();

imp.addEventListener('click', e => { e.preventDefault(); fileIn.click(); });
document.getElementById('new').addEventListener('click', async e => {
  e.preventDefault();
  localStorage.removeItem('modelName');
  let lm = '';
  try { lm = (await fetch('model.stl', { method: 'HEAD' })).headers.get('Last-Modified') || ''; } catch {}
  localStorage.setItem('emptyModel', lm);
  importedBuf = null;
  applyGeometry(emptyGeometry(), true);
  mname.value = 'model';
  mname.dispatchEvent(new Event('input'));
});

// export: native Save-As dialog shown by the server (works in preview and
// normal browsers); falls back to a plain download if server is down.
dl.addEventListener('click', async e => {
  e.preventDefault();
  const buf = importedBuf || await (await fetch('model.stl')).arrayBuffer();
  const name = mname.value || 'model';
  try {
    const r = await fetch('/export?name=' + encodeURIComponent(name),
      { method: 'POST', body: buf });
    const res = await r.json();
    if (res.saved) {
      dl.textContent = tr('saved');
    } else {
      dl.textContent = tr('cancelled');
    }
    setTimeout(() => { dl.textContent = tr('exportStl'); }, 1500);
    return;
  } catch (err) {
    console.error('server export failed, falling back to download:', err);
  }
  const url = URL.createObjectURL(new Blob([buf], { type: 'model/stl' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name + '.stl';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});

function emptyGeometry() {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
  return g;
}

const stlLoader = new STLLoader();
function loadModel() {
  // missing model.stl is normal (fresh clone) -> empty scene, not an error
  fetch('model.stl').then(r => {
    if (!r.ok) { applyGeometry(emptyGeometry(), true); return; }
    return r.arrayBuffer().then(b => applyGeometry(stlLoader.parse(b), true));
  }).catch(() => applyGeometry(emptyGeometry(), true));
}
const emptyLm = localStorage.getItem('emptyModel');
if (emptyLm !== null) {
  // scene was emptied: stay empty until model.stl is regenerated
  fetch('model.stl', { method: 'HEAD' }).then(r => {
    const lm = r.headers.get('Last-Modified') || '';
    if (lm !== emptyLm) {
      localStorage.removeItem('emptyModel');
      loadModel();
    } else {
      applyGeometry(emptyGeometry(), true);
    }
  }).catch(() => applyGeometry(emptyGeometry(), true));
} else {
  loadModel();
}

// reset view to the grid center
document.getElementById('home').addEventListener('click', () => {
  camera.position.set(modelSize * 1.2, modelSize * 1.2, modelSize * 1.6);
  controls.target.set(0, 0, 0);
  controls.update();
});

// import: pick any STL file -> displayed for viewing/selection
const fileIn = document.createElement('input');
fileIn.type = 'file';
fileIn.accept = '.stl';
fileIn.style.display = 'none';
document.body.appendChild(fileIn);
fileIn.addEventListener('change', async () => {
  const f = fileIn.files[0];
  if (!f) return;
  localStorage.removeItem('emptyModel');
  importedBuf = await f.arrayBuffer();
  applyGeometry(stlLoader.parse(importedBuf), true);
  const mn = document.getElementById('mname');
  if (mn) { mn.value = f.name.replace(/\.stl$/i, ''); mn.dispatchEvent(new Event('input')); }
  fileIn.value = '';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
